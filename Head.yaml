port: 6152
socks-port: 6153
mixed-port: 8899
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: dler

experimental:
  ignore-resolve-fail: true

dns:
  enable: true
  # ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 1.1.1.1
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    # - https://cloudflare-dns.com/dns-query
    # - https://dns.cloudflare.com/dns-query
    # - https://dns.google/dns-query
    # - https://dns.quad9.net/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    # 代理节点域名解析，避免 DNS 循环依赖
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 国内外域名智能分流
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://dns.google/dns-query
      - https://dns.quad9.net/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "ntp.*.com"
    - "ntp1.*.com"
    - "ntp2.*.com"
    - "ntp3.*.com"
    - "ntp4.*.com"
    - "ntp5.*.com"
    - "ntp6.*.com"
    - "ntp7.*.com"
    - "*.time.edu.cn"
    - "*.oix_nodes.com"
