port: 6152
socks-port: 6153
mixed-port: 8899
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: dler

# 本配置需 mihomo（Clash Meta）内核：geosite、respect-rules、proxy-server-nameserver 原版 Clash 不支持
# GeoIP / GeoSite 数据库下载地址（默认 GitHub 在国内可能拉不下来）
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

tun:
  enable: true
  stack: system
  # 劫持所有发往 53 端口的 DNS 请求，避免系统 DNS 绕过 Clash
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
dns:
  enable: true
  # ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # DNS 查询跟随分流规则：境外 DoH 按规则经代理发出（1.1.1.1 / 8.8.8.8 命中 MATCH,Others）
  respect-rules: true
  # 仅用于解析下方 DoH 服务器自身的域名，必须是 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 解析代理节点域名，直连国内 DNS（开启 respect-rules 时必填）
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 默认：境外 DoH，不在 geosite:cn 的域名（含检测页随机域名）都用它，避免泄露给国内 DNS
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  # 国内域名与私有域名仍用国内 DNS，保证解析到国内 CDN
  # 用 IP 形式并指定 #DIRECT：dns.alidns.com / doh.pub 不在 Domestic 列表，避免开启 respect-rules 后被分到代理
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query#DIRECT
      - https://1.12.12.12/dns-query#DIRECT
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "ntp.*.com"
    - "ntp1.*.com"
    - "ntp2.*.com"
    - "ntp3.*.com"
    - "ntp4.*.com"
    - "ntp5.*.com"
    - "ntp6.*.com"
    - "ntp7.*.com"
    - "*.time.edu.cn"
    - "*.oix_nodes.com"
